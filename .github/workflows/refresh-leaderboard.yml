name: Refresh leaderboard snapshot

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refresh-leaderboard.mjs
      - name: Commit if changed
        run: |
          if ! git diff --quiet src/data/leaderboard.json; then
            git config user.name "leaderboard-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/data/leaderboard.json
            git commit -m "chore: refresh leaderboard snapshot"
            git push
          else
            echo "snapshot unchanged"
          fi
